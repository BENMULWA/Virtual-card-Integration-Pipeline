# Include INSIDE the `server { listen 443 ssl; server_name <your cards host>; ... }` block for this API.
# Use a host of its own (e.g. cards.mamlakapsp.com): payments.mamlakapsp.com is the payments gateway and does not
# serve these routes. If you do share a server block, nginx picks the longest matching prefix, so these routes win
# only for paths this app owns.
#
#   sudo cp nginx-cards.conf /etc/nginx/snippets/mamlaka-cards.conf
#   (add the line  include snippets/mamlaka-cards.conf;  inside the server block)
#   sudo nginx -t && sudo systemctl reload nginx

# Health check (public)
location = /health {
    proxy_pass http://127.0.0.1:8000;
}

# Callbacks FROM Wasabi and Safaricom: must be public
location /api/v1/webhooks/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, never append, so clients cannot spoof it
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 1m;
}
location /api/v1/mpesa/callback/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 1m;
}

# Customer/API routes: access is controlled by the user's JWT (and the step-up checks), not by IP. The old
# placeholder allow/deny rules that blocked every real customer have been removed.
location /api/v1/cards/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 3m;                          # KYC images are limited to 2 MB each
    proxy_read_timeout 60s;
}
location /api/v1/wallet/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Reseller (partner) API: authenticated by the reseller's API key, so it is public. KYC images are capped at 2 MB each.
location /api/v1/partner/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 3m;
    proxy_read_timeout 60s;
}
